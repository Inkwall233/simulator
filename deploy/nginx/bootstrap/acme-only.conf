# ============================================================
# 首次签发证书用的最小配置（仅 80 端口，不放行任何业务）
#
# 存在的意义：nginx 一旦引用尚不存在的 ssl_certificate 文件会启动失败，
# 而 certbot 的 HTTP-01 验证又需要 nginx 先把 80 端口跑起来，
# 于是形成"先有证书还是先有 nginx"的鸡生蛋问题。
#
# 用法（首次部署）：
#   1. docker compose 里把 ./nginx/conf.d 临时改成 ./nginx/bootstrap
#   2. docker compose up -d edge
#   3. 跑 certbot 签发证书（见终端说明）
#   4. 改回 ./nginx/conf.d，执行 docker compose up -d --force-recreate edge
# ============================================================

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        default_type text/plain;
        return 200 'skilllab acme bootstrap ok';
    }
}
