# ============================================================
# skilllab-admin.xyz —— 管理端
#   /        → web-admin 静态包（root: /srv/admin）
#   /api/    → skilllab-admin 后端（Spring Boot，容器 backend:8080）
#
# 管理端同样通过 VITE_SIMULATOR_URL 跨域内嵌 https://sim.skilllab.xyz，
# 因此 sim.skilllab.xyz 的 CSP frame-ancestors 里必须放行本域名。
# ============================================================

# ---------------------------------------------- 80：ACME + 跳转 HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name skilllab-admin.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------- 443：正式站点
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name skilllab-admin.xyz;

    ssl_certificate     /etc/letsencrypt/live/skilllab-admin.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skilllab-admin.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    # 管理端不需要被别人内嵌，锁死 SAMEORIGIN（本页自己嵌入 sim 不受影响）
    add_header X-Frame-Options           "SAMEORIGIN"                       always;

    root  /srv/admin;
    index index.html;
    client_max_body_size 32m;

    # ---------------- 后端接口 ----------------
    # AI package uploads are larger than the default API body limit.
    location ^~ /api/ai/device-projects/ {
        client_max_body_size 210m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set      $backend_host backend:8080;
        proxy_pass http://$backend_host;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set      $backend_host backend:8080;
        proxy_pass http://$backend_host;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }

    # ---------------- 静态资源 ----------------
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
