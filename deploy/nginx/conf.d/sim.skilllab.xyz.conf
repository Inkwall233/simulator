# ============================================================
# sim.skilllab.xyz —— 仿真模拟器（本项目核心）
#   /                     → web-simulator 静态包（root: /srv/sim）
#   /runtime               → Vue Router 路由（SPA 回退到 index.html）
#   /device-demo/index.html→ 自建仿真相机"设备静态包"（iframe 加载）
#   /device-demo/api/*     → 被 Service Worker 在浏览器内拦截，不落到服务器
#   /sim/sim-bridge.js     → 注入到设备页的加工脚本
#
# ⚠ 为什么模拟器必须独占一个 origin 的根路径：
#   代码里硬编码了 /device-demo/... 与 /sim/... 这些根路径
#   （RuntimeView.vue 的 DEVICE_URL、mock-sw.js 注册路径与 scope、
#     device-demo/app.js 的 API 前缀）。挂到 /simulator/ 之类子路径下
#   会全部 404，必须改代码 + 设 Vite base 才行。
#
# ⚠ Service Worker 只在安全上下文（HTTPS / localhost）可用，
#   所以本域名必须配证书，且不能只跑 HTTP。
# ============================================================

# ---------------------------------------------- 80：ACME + 跳转 HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name sim.skilllab.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------- 443：正式站点
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name sim.skilllab.xyz;

    ssl_certificate     /etc/letsencrypt/live/sim.skilllab.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sim.skilllab.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # ⚠ 这里刻意不写 X-Frame-Options：本域名要被 skilllab.xyz 与
    #   skilllab-admin.xyz 跨域 iframe 内嵌，一旦发 SAMEORIGIN/ DENY
    #   浏览器会直接拦掉，模拟器就白屏。改用 CSP frame-ancestors 精确放行。
    add_header Content-Security-Policy "frame-ancestors https://skilllab.xyz https://skilllab-admin.xyz" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    root  /srv/sim;
    index index.html;
    client_max_body_size 16m;

    # ---------------- 静态资源 ----------------
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location = /index.html {
        expires -1;
    }

    # 设备包与桥接脚本必须不缓存：
    #   - /device-demo/mock-sw.js 是 SW 脚本，缓存会导致旧版本 Mock 长期生效
    #   - /sim/sim-bridge.js 每次打开设备页都要注入最新版
    #   - 设备包本身迭代频繁，缓存会让人误以为改动没生效
    location /device-demo/ {
        expires -1;
    }
    location /sim/ {
        expires -1;
    }

    location /api/simulator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 路由回退（/runtime 直接刷新也能进）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
