# ============================================================
# http 层公共配置（该文件被 nginx.conf 的 http{} 块 include）
# ============================================================

charset utf-8;
server_tokens off;

keepalive_timeout     65s;
client_body_timeout   30s;
client_header_timeout 30s;
send_timeout          60s;

# ---- gzip：Vite 产物压缩收益明显（js/css 通常能压到 1/3）----
gzip              on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_vary         on;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml
    font/woff2;
