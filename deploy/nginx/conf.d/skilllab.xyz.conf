# ============================================================
# skilllab.xyz —— 学员端
#   /        → web-front 静态包（root: /srv/front）
#   /api/    → skilllab-admin 后端（Spring Boot，容器 backend:8080）
#
# 注意：页面里通过 VITE_SIMULATOR_URL 内嵌仿真模拟器，
#       该地址指向 https://sim.skilllab.xyz（跨域 iframe）。
# ============================================================

# ---------------------------------------------- 80：ACME + 跳转 HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name skilllab.xyz;

    # Let's Encrypt HTTP-01 验证路径（webroot 模式，首次签发/续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------- 443：正式站点
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name skilllab.xyz;

    ssl_certificate     /etc/letsencrypt/live/skilllab.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skilllab.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 这些 add_header 写在 server 层：下面各 location 都没有自己的
    # add_header，因此会被完整继承（nginx 的 add_header 不叠加，一旦
    # 某 location 自己写了 add_header，父级的就全部失效——所以此处
    # 缓存控制统一用 expires 实现，不用 add_header）。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header X-Frame-Options           "SAMEORIGIN"                       always;

    root  /srv/front;
    index index.html;
    client_max_body_size 32m;

    # ---------------- 后端接口 ----------------
    location /api/ {
        # 用变量 + resolver：backend 容器重建后 IP 变化时也能重新解析，
        # 避免 nginx 一直用启动时缓存下来的旧 IP。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set      $backend_host backend:8080;
        proxy_pass http://$backend_host;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 关闭缓冲，便于后续接 SSE / 流式响应（如训练进度推送）
        proxy_buffering off;
    }

    # ---------------- 静态资源 ----------------
    # Vite 产物带内容哈希，可长期强缓存
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # 入口 HTML 必须不缓存，否则发版后用户拿不到新的 assets 引用
    location = /index.html {
        expires -1;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
